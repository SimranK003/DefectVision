name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GPU training never runs in CI - it needs real hardware and hours of wall
# time. CI's job is to prove the code is correct and the images build, using
# the synthetic-fixture ML tests and a throwaway Postgres/Redis pair for the
# backend tests.

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements/dev.txt
      - run: ruff check backend/app backend/tests ml/src ml/scripts ml/tests

  test-ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements/ml.txt
      - run: python -m pytest ml/tests/ -v

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: defectvision
          POSTGRES_PASSWORD: defectvision
          POSTGRES_DB: defectvision_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U defectvision"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://defectvision:defectvision@localhost:5432/defectvision_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements/backend.txt
      - name: Run Alembic migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://defectvision:defectvision@localhost:5432/defectvision_test
        run: alembic upgrade head
      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -v

  lint-and-build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  build-docker-images:
    runs-on: ubuntu-latest
    needs: [lint-python, test-backend, lint-and-build-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend/worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          push: false
          tags: defectvision-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/frontend.Dockerfile
          push: false
          tags: defectvision-frontend:ci
